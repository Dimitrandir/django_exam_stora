{% extends 'base.html' %}
{% load i18n %}

{% block title %}STORA - {% translate "Login" %}{% endblock %}

{% block content %}
<h1>{% translate "Login" %}</h1>

<form method="post" action="{% url 'login' %}{% if next %}?next={{ next }}{% endif %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% translate "Login" %}</button>
</form>
{% endblock %}
