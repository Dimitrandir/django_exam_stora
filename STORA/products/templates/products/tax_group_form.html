{% extends 'base.html' %}

{% block content %}

    {% if tax_group %}
        <h1>Edit tax group: {{ tax_group.name }}</h1>
    {% else %}
        <h1>Add new tax group</h1>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>

    <hr>

    <a href="{% url 'tax_group_list' %}">Cancel</a>

{% endblock %}
