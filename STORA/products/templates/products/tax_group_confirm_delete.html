{% extends 'base.html' %}

{% block title %}STORA - Delete Tax Group{% endblock %}

{% block content %}

<h1>Are you sure you want to delete tax group: "{{ tax_group.name }}"?</h1>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="delete_button">YES</button>
    <a href="{% url 'tax_group_list' %}" class="button_cancel">NO</a>
</form>

{% endblock %}
