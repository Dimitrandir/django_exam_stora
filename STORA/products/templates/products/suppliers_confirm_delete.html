{% extends 'base.html' %}
{% load i18n %}

{% block title %}STORA - Delete Supplier{% endblock %}

{% block content %}

<h1>{% blocktranslate with name=supplier.name %}Are you sure you want to delete supplier: "{{ name }}"?{% endblocktranslate %}</h1>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="delete_button">{% translate "YES" %}</button>
    <a href="{% url 'suppliers_list' %}" class="button_cancel">{% translate "NO" %}</a>
</form>

{% endblock %}
