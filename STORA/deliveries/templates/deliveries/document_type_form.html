{% extends 'base.html' %}

{% block content %}

    {% if document_type %}
        <h1>Edit document type: {{ document_type.name }}</h1>
    {% else %}
        <h1>Add new document type</h1>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>

    <hr>

    <a href="{% url 'document_type_list' %}">Cancel</a>

{% endblock %}
