{% extends 'base.html' %}

{% block title %}STORA - Delete Scrap Reason{% endblock %}

{% block content %}

<h1>Are you sure you want to delete scrap reason: "{{ scrap_reason.name }}"?</h1>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="delete_button">YES</button>
    <a href="{% url 'scrap_reason_list' %}" class="button_cancel">NO</a>
</form>

{% endblock %}
